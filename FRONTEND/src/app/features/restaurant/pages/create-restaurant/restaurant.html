<div class="container">
    <h2>Create New Restaurant</h2>

    <form [formGroup]="restaurantForm" (ngSubmit)="onSubmit()">

        <div class="form-group">
            <label>Name</label>
            <input type="text" formControlName="name" placeholder="Restaurant Name">
        </div>

        <div class="form-group">
            <label>Category</label>
            <input type="text" formControlName="category" placeholder="e.g. Italian, BBQ">
        </div>

        <div class="form-group">
            <label class="block text-sm font-medium text-gray-700">Assign Manager</label>
            <select formControlName="managerId"
                class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md border">
                <option value="" disabled>Select a worker</option>

                @for (worker of availableManagers; track worker.userId) {
                <option [value]="worker.userId">
                    {{ worker.firstName }} {{ worker.lastName }}
                </option>
                }
            </select>

            @if (availableManagers.length === 0) {
            <p class="text-sm text-red-500 mt-1">
                No workers found. Please create a user with 'Restaurant Worker' role first.
            </p>
            }
        </div>

        <div class="form-group position-relative">
            <label>Address (Search & Select)</label>
            <input type="text" (input)="onAddressInput($event)" placeholder="Start typing address..."
                class="search-input">

            <!-- Address Suggestions Dropdown -->
            @if (addressSuggestions.length > 0) {
            <ul class="suggestions-list">
                @for (item of addressSuggestions; track $index) {
                <li (click)="selectAddress(item)">
                    {{ item.display_name }}
                </li>
                }
            </ul>
            }
        </div>

        <!-- Read-only confirmation field -->
        <div class="form-group">
            <label>Selected Location:</label>
            <input type="text" formControlName="address" readonly class="readonly-field">
        </div>

        <button type="submit" [disabled]="restaurantForm.invalid">Create Restaurant</button>
    </form>
</div>
