services:

  # --- GATEWAY (The Only Public Entry Point) ---
  gateway:
    build:
      context: .
      dockerfile: API_GATEWAY/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080" # ONLY this is exposed to your browser
    environment:
      # These addresses are INTERNAL to the Docker network
      - AUTH_SERVICE_ADDRESS=auth-service:8082
      - RESTAURANT_SERVICE_ADDRESS=restaurant-service:8083
      - STAKEHOLDERS_SERVICE_ADDRESS=stakeholders-service:8084
      - SHOPPING_CART_SERVICE_ADDRESS=shopping-cart-service:8085
      - PRICING_SERVICE_ADDRESS=pricing-service:8086
      - ANALYSIS_SERVICE_ADDRESS=analysis-service:8087
      - ORDER_SERVICE_ADDRESS=order-service:8088
      - JWT_SECRET=my_super_secure_delivery_app_secret_key_2025
    depends_on:
      - auth
      - restaurant
      - stakeholders
      - shopping-cart
      - pricing
      - analysis
      - order

  # --- AUTH ---
  auth:
    build:
      context: .
      dockerfile: AUTH/Dockerfile
    container_name: auth-service
    # No "ports" section -> Internal Only
    environment:
      DB_HOST: auth-db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: auth_db
      DB_PORT: 5432
      PORT: 8082 # Internal Listening Port
      JWT_SECRET: "my_super_secure_delivery_app_secret_key_2025"
    depends_on:
      auth-db:
        condition: service_healthy

  auth-db:
    image: postgres:16
    container_name: auth-db
    restart: always
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432" # Database can stay exposed for Admin tools (DBeaver)
    volumes:
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- RESTAURANT ---
  restaurant:
    build:
      context: .
      dockerfile: RESTAURANT/Dockerfile
    container_name: restaurant-service
    # No "ports" section
    environment:
      DB_HOST: restaurant-db
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: restaurant_db
      DB_PORT: 5432
      PORT: 8083 # Internal Listening Port
    depends_on:
      restaurant-db:
        condition: service_healthy

  restaurant-db:
    image: postgres:16
    container_name: restaurant-db
    restart: always
    environment:
      POSTGRES_DB: restaurant_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - restaurant_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

